<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Surprise ❤️</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:monospace;
text-align:center;
overflow-x:hidden;
}

/* terminal */
#terminal{
position:absolute;
top:40%;
width:100%;
font-size:28px;
}

/* main */
#main{
display:none;
padding:20px;
}

h1{
font-size:50px;
color:pink;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px pink;}
to{ text-shadow:0 0 40px red;}
}

/* gallery */
.gallery img{
width:220px;
margin:10px;
border-radius:15px;
transition:0.4s;
}

.gallery img:hover{
transform:scale(1.2);
}

/* button */
button{
padding:10px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:pink;
cursor:pointer;
margin:10px;
}

/* hearts */
.heart{
position:fixed;
top:-10px;
color:red;
font-size:20px;
animation:fall 5s linear;
}

@keyframes fall{
0%{transform:translateY(-10px);}
100%{transform:translateY(100vh);}
}

/* mini game */
#gameArea{
height:200px;
border:2px solid pink;
margin-top:20px;
position:relative;
overflow:hidden;
}

.gameHeart{
position:absolute;
font-size:30px;
cursor:pointer;
}

/* poetry section */
#poetryContainer{
display:flex;
justify-content:space-between;
align-items:center;
margin:30px 0;
}

#poetryText{
width:60%;
font-size:22px;
line-height:1.5;
color:#ffb6c1;
}

.sidePic{
width:18%;
border-radius:15px;
}

</style>
</head>

<body>

<div id="terminal">
<div id="text"></div>
</div>

<div id="main">

<h1>Happy Birthday My Love 🎂❤️</h1>

<!-- Play Song Button -->
<button onclick="playSong()">🎵 Play Our Song</button>
<audio id="mysong">
  <source src="https://raw.githubusercontent.com/Alimalix8886/Happybirthday/f02400fee303e96b61474489a240b6190798c0f1/Song.mpeg" type="audio/mpeg">
</audio>

<!-- Poetry Section -->
<div id="poetryContainer">
  <img src="https://raw.githubusercontent.com/Alimalix8886/Happybirthday/032fab0996e646c5038f3c4353798fded4cda789/Rightpic.jpeg" class="sidePic">
  <div id="poetryText">
    💖 Roses are red,<br>
    Violets are blue,<br>
    Today is special,<br>
    Because of you! 🌸<br><br>
    Happy Birthday, My Queen 👑❤️
  </div>
  <img src="https://raw.githubusercontent.com/Alimalix8886/Happybirthday/2e393bc6b9146dd4c37439d4fc112533a84681e4/Leftpic.jpeg" class="sidePic">
</div>

<h2>Our Memories 📸</h2>
<div class="gallery">
  <img src="pic1.jpg">
  <img src="pic2.jpg">
  <img src="pic3.jpg">
  <img src="pic4.jpg">
</div>

<h2>Catch My Heart Game ❤️</h2>
<div id="gameArea"></div>
<p>Score: <span id="score">0</span></p>

<button onclick="surprise()">Open Final Surprise 🎁</button>
<p id="msg"></p>

</div>

<script>
/* Terminal Loading */
let lines=[
"Loading love.exe ...",
"Connecting to heart ❤️ ...",
"Checking memories ...",
"Preparing romantic surprise ...",
"Surprise ready ❤️"
];
let i=0;
function typeLine(){
  if(i<lines.length){
    document.getElementById("text").innerHTML+=lines[i]+"<br>";
    i++;
    setTimeout(typeLine,900);
  }else{
    setTimeout(()=>{
      document.getElementById("terminal").style.display="none";
      document.getElementById("main").style.display="block";
    },1500);
  }
}
typeLine();

/* Play Song */
function playSong(){
  document.getElementById("mysong").play();
}

/* Falling Hearts */
function hearts(){
  let heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove()},5000);
}
setInterval(hearts,300);

/* Mini Heart Game */
let score=0;
function spawnHeart(){
  let heart=document.createElement("div");
  heart.className="gameHeart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*90+"%";
  heart.style.top=Math.random()*80+"%";
  heart.onclick=function(){
    score++;
    document.getElementById("score").innerText=score;
    heart.remove();
  }
  document.getElementById("gameArea").appendChild(heart);
  setTimeout(()=>{heart.remove()},2000);
}
setInterval(spawnHeart,800);

/* Final Surprise */
function surprise(){
  document.getElementById("msg").innerHTML=
  "💖 You are the most beautiful part of my life.<br><br>Happy Birthday My Queen 👑❤️";
}
</script>

</body>
</html>
